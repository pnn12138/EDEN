# ============================================================
# CNB 云原生构建配置（备用部署链路）
#
# 本文件声明：
# - onlyPreview: true  → 仅预览构建，不污染主分支产物
# - daemon: true       → 构建后常驻守护，评审可随时访问预览环境
#
# 实际构建命令与运行环境变量（LLM_PROVIDER / 密钥）在 CNB 控制台配置，
# 镜像使用固定公共地址，不依赖动态仓库变量。
# ============================================================

version: 1

# 仅预览构建
onlyPreview: true

# 构建后常驻守护（daemon），便于评委随时访问
daemon: true

build:
  # 构建命令（与 EdgeOne 一致）
  steps:
    - run: npm ci
    - run: npm run build
  # 产物目录（由 npm run build 生成）
  output: .next

# 运行时：Node，保留 /api/* 服务端路由（禁止静态导出）
runtime: node

# 环境变量仅声明名称，值在 CNB 控制台注入（不入库）
env:
  LLM_PROVIDER:
    required: false
  VOLCENGINE_API_KEY:
    required: false
    secret: true
  VOLCENGINE_BASE_URL:
    required: false
  VOLCENGINE_MODEL:
    required: false
  DEEPSEEK_API_KEY:
    required: false
    secret: true
  DEEPSEEK_BASE_URL:
    required: false
  DEEPSEEK_MODEL:
    required: false
