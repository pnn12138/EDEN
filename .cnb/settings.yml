# ============================================================
# CNB 运行设置（备用部署链路）
#
# 声明预览环境的访问入口与「启动」按钮文案。
# 镜像内部以 npm run start -H 0.0.0.0 -p 8686 常驻（见 Dockerfile）。
# 具体平台字段以 CNB 控制台为准，本文件仅作声明与意图记录。
# ============================================================

# 服务端口（与 Dockerfile EXPOSE / CMD 一致）
services:
  web:
    port: 8686
    # 启动按钮文案（评审点击即进入游戏）
    launchButton:
      label: 进入伊甸园
      # 入口路径：首页
      path: /
    healthCheck:
      path: /api/health

# 不在此写死任何密钥；密钥在 CNB 控制台以构建/运行环境变量注入
